<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>I Love You</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Caveat:wght@600;700&display=swap');

  :root{
    --sky: #ffd9c9;
    --sky2: #ffb6c9;
    --lav: #c9b6ff;
    --plum: #6b3f75;
    --cream: #fff6ef;
    --heart: #ff5c7a;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; height:100%;
    background: linear-gradient(160deg, var(--sky) 0%, var(--sky2) 45%, var(--lav) 100%);
    background-size: 200% 200%;
    animation: gradientShift 12s ease-in-out infinite;
    font-family:'Fredoka', sans-serif;
    overflow:hidden;
  }
  @keyframes gradientShift{
    0%, 100%{ background-position: 0% 30%; }
    50%{ background-position: 100% 70%; }
  }

  .sparkle{
    position:absolute;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    opacity:0;
    animation: twinkle 2.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes twinkle{
    0%, 100%{ opacity:0; transform: scale(0.6); }
    50%{ opacity:0.9; transform: scale(1); }
  }

  .stage{
    position:relative;
    height:100vh;
    width:100vw;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* soft clouds / dots for texture */
  .dot{
    position:absolute;
    border-radius:50%;
    background: rgba(255,255,255,0.5);
  }

  .scene{
    position:relative;
    width:min(420px,88vw);
    text-align:center;
  }

  .tap-msg{
    font-family:'Caveat', cursive;
    font-size: 26px;
    color: var(--plum);
    margin-bottom: 8px;
    opacity:0.9;
    transition: opacity 0.4s ease;
  }

  .couple-box{
    position:relative;
    width:100%;
    height:220px;
    cursor:pointer;
  }

  svg{ width:100%; height:100%; overflow:visible; }

  /* characters slide toward center */
  #boy{
    transition: transform 1.1s cubic-bezier(.34,1.4,.5,1);
    transform: translateX(-70px);
    animation: sway 3.4s ease-in-out infinite;
    transform-origin: bottom center;
  }
  #girl{
    transition: transform 1.1s cubic-bezier(.34,1.4,.5,1);
    transform: translateX(70px);
    animation: sway 3.4s ease-in-out infinite 0.4s;
    transform-origin: bottom center;
  }
  @keyframes sway{
    0%, 100%{ margin-top: 0px; }
    50%{ margin-top: -5px; }
  }
  .stage.hugging #boy{
    transform: translateX(-10px) rotate(-3deg);
    animation: none;
  }
  .stage.hugging #girl{
    transform: translateX(10px) rotate(3deg);
    animation: none;
  }

  .pop-heart{
    opacity:0;
    transform: scale(0) translateY(0px);
    transition: opacity 0.4s ease, transform 0.6s cubic-bezier(.34,1.6,.5,1);
  }
  .stage.hugging .pop-heart{
    opacity:1;
    transform: scale(1) translateY(-6px);
  }

  .big-text{
    position:relative;
    margin-top: 6px;
    font-weight:700;
    font-size: clamp(38px, 11vw, 64px);
    color: var(--heart);
    text-shadow: 3px 3px 0 rgba(107,63,117,0.18);
    letter-spacing: 0.01em;
    opacity:0;
    transform: translateY(14px) scale(0.85);
    transition: opacity 0.5s ease 0.35s, transform 0.6s cubic-bezier(.34,1.4,.5,1) 0.35s;
  }
  .big-text::before{
    content:"";
    position:absolute;
    left:50%; top:50%;
    width:140%; height:220%;
    transform: translate(-50%,-50%);
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 70%);
    z-index:-1;
  }
  .stage.hugging .big-text{
    opacity:1;
    transform: translateY(0) scale(1);
  }

  .sub-text{
    font-family:'Caveat', cursive;
    font-size: 24px;
    color: var(--plum);
    opacity:0;
    transform: translateY(10px);
    transition: opacity 0.5s ease 0.6s, transform 0.5s ease 0.6s;
  }
  .stage.hugging .sub-text{
    opacity:1;
    transform: translateY(0);
  }

  /* floating hearts burst */
  .burst-heart{
    position:absolute;
    left:50%; top:40%;
    font-size:20px;
    color: var(--heart);
    opacity:0;
    pointer-events:none;
  }
  .stage.hugging .burst-heart{
    animation: fly 1.4s ease-out forwards;
  }
  @keyframes fly{
    0%{ opacity:1; transform: translate(-50%,-50%) scale(0.4); }
    100%{ opacity:0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot)); }
  }

  .again{
    margin-top: 14px;
    background:none;
    border: 2px solid var(--plum);
    color: var(--plum);
    font-family:'Fredoka', sans-serif;
    font-size: 14px;
    padding: 6px 16px;
    border-radius: 20px;
    cursor:pointer;
    opacity:0;
    transition: opacity 0.5s ease 0.7s;
  }
  .stage.hugging .again{ opacity:0.85; }
  .again:hover{ background: rgba(107,63,117,0.12); transform: translateY(-1px); }
  .again:active{ transform: translateY(0px) scale(0.97); }

  @media (prefers-reduced-motion: reduce){
    #boy,#girl,.pop-heart,.big-text,.sub-text,.burst-heart{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <div class="scene">
    <div class="tap-msg" id="tapMsg">tap us ✨</div>

    <div class="couple-box" id="tapZone">
      <svg viewBox="0 0 400 240">
        <!-- ground shadow -->
        <ellipse cx="200" cy="205" rx="120" ry="12" fill="rgba(107,63,117,0.12)"/>

        <!-- BOY -->
        <g id="boy">
          <g transform="translate(150,60)">
            <!-- body -->
            <path d="M -32 150 Q -34 90 0 88 Q 34 90 32 150 Z" fill="#7d5fff"/>
            <!-- head -->
            <circle cx="0" cy="45" r="40" fill="#ffd8b0"/>
            <!-- hair -->
            <path d="M -40 30 Q -38 -10 0 -14 Q 40 -10 40 30 Q 30 8 0 8 Q -30 8 -40 30 Z" fill="#4a3324"/>
            <!-- eyes -->
            <circle cx="-13" cy="48" r="3.4" fill="#402a20"/>
            <circle cx="13" cy="48" r="3.4" fill="#402a20"/>
            <!-- smile -->
            <path d="M -10 60 Q 0 68 10 60" stroke="#402a20" stroke-width="3" fill="none" stroke-linecap="round"/>
            <!-- blush -->
            <circle cx="-22" cy="58" r="5" fill="#ffb0a0" opacity="0.6"/>
            <circle cx="22" cy="58" r="5" fill="#ffb0a0" opacity="0.6"/>
            <!-- arm reaching -->
            <path d="M 28 105 Q 60 110 62 140" stroke="#ffd8b0" stroke-width="16" fill="none" stroke-linecap="round"/>
          </g>
        </g>

        <!-- GIRL -->
        <g id="girl">
          <g transform="translate(250,60)">
            <path d="M -34 150 Q -36 88 0 86 Q 36 88 34 150 Z" fill="#ff7fa3"/>
            <circle cx="0" cy="45" r="40" fill="#ffe0c2"/>
            <path d="M -42 20 Q -45 70 -30 95 Q -38 55 -30 25 Z" fill="#3a2418"/>
            <path d="M 42 20 Q 45 70 30 95 Q 38 55 30 25 Z" fill="#3a2418"/>
            <path d="M -40 20 Q -38 -14 0 -16 Q 38 -14 40 20 Q 28 2 0 2 Q -28 2 -40 20 Z" fill="#3a2418"/>
            <circle cx="-13" cy="48" r="3.4" fill="#402a20"/>
            <circle cx="13" cy="48" r="3.4" fill="#402a20"/>
            <path d="M -10 60 Q 0 68 10 60" stroke="#402a20" stroke-width="3" fill="none" stroke-linecap="round"/>
            <circle cx="-22" cy="58" r="5" fill="#ff9fae" opacity="0.7"/>
            <circle cx="22" cy="58" r="5" fill="#ff9fae" opacity="0.7"/>
            <path d="M -28 105 Q -60 110 -62 140" stroke="#ffe0c2" stroke-width="16" fill="none" stroke-linecap="round"/>
          </g>
        </g>

        <!-- little heart that pops above their hug -->
        <g class="pop-heart" transform="translate(200,55)">
          <path d="M0 14 C -14 0 -14 -16 0 -8 C 14 -16 14 0 0 14 Z" fill="#ff5c7a"/>
        </g>
      </svg>

      <!-- burst hearts -->
      <span class="burst-heart" style="--dx:-70px; --dy:-90px; --rot:-20deg;">♥</span>
      <span class="burst-heart" style="--dx:70px; --dy:-100px; --rot:20deg;">♥</span>
      <span class="burst-heart" style="--dx:-40px; --dy:-130px; --rot:-10deg; animation-delay:0.1s;">❤</span>
      <span class="burst-heart" style="--dx:40px; --dy:-130px; --rot:10deg; animation-delay:0.15s;">❤</span>
      <span class="burst-heart" style="--dx:0px; --dy:-150px; --rot:0deg; animation-delay:0.05s;">♡</span>
      <span class="burst-heart" style="--dx:-95px; --dy:-40px; --rot:-15deg; animation-delay:0.2s;">♥</span>
      <span class="burst-heart" style="--dx:95px; --dy:-40px; --rot:15deg; animation-delay:0.22s;">♥</span>
    </div>

    <div class="big-text">I LOVE YOU</div>
    <div class="sub-text">more than words, from miles away 💛</div>
    <button class="again" id="againBtn">aww, again?</button>
  </div>
</div>

<script>
  const stage = document.getElementById('stage');
  const tapZone = document.getElementById('tapZone');
  const tapMsg = document.getElementById('tapMsg');
  const againBtn = document.getElementById('againBtn');

  function hug(){
    stage.classList.add('hugging');
    tapMsg.style.opacity = 0;
  }
  function reset(){
    stage.classList.remove('hugging');
    tapMsg.style.opacity = 0.9;
  }

  tapZone.addEventListener('click', () => {
    if(!stage.classList.contains('hugging')) hug();
  });

  againBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    reset();
    setTimeout(hug, 500);
  });

  // soft background dots
  for(let i=0;i<14;i++){
    const d = document.createElement('div');
    d.className='dot';
    const s = 6 + Math.random()*14;
    d.style.width = s+'px';
    d.style.height = s+'px';
    d.style.left = Math.random()*100+'%';
    d.style.top = Math.random()*100+'%';
    d.style.opacity = 0.15 + Math.random()*0.3;
    document.querySelector('.stage').appendChild(d);
  }

  // twinkling sparkles
  const sparkleChars = ['✦','✧','⋆'];
  for(let i=0;i<10;i++){
    const sp = document.createElement('div');
    sp.className='sparkle';
    sp.textContent = sparkleChars[Math.floor(Math.random()*sparkleChars.length)];
    sp.style.left = Math.random()*100+'%';
    sp.style.top = Math.random()*100+'%';
    sp.style.fontSize = (10 + Math.random()*10)+'px';
    sp.style.animationDelay = (Math.random()*2.6)+'s';
    document.querySelector('.stage').appendChild(sp);
  }
</script>

</body>
</html>
